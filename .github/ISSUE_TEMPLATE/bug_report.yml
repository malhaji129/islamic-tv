name: مشكلة / Bug report
description: Report a reproducible TV or screensaver issue
title: "[Bug] "
body:
  - type: input
    id: device
    attributes:
      label: TV model and Android version
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected result and actual result
      description: Remove account names, IP addresses, tokens and private data from logs/screenshots.
    validations:
      required: true
