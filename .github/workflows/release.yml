name: Publish signed release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - name: Prepare private release key
        env:
          KEY_B64: ${{ secrets.ISLAMIC_TV_KEYSTORE_B64 }}
        run: |
          test -n "$KEY_B64"
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/islamic-tv.jks"
          chmod 600 "$RUNNER_TEMP/islamic-tv.jks"
      - name: Test and build signed public APKs
        env:
          ISLAMIC_TV_KEYSTORE: ${{ runner.temp }}/islamic-tv.jks
          ISLAMIC_TV_STORE_PASSWORD: ${{ secrets.ISLAMIC_TV_STORE_PASSWORD }}
          ISLAMIC_TV_KEY_PASSWORD: ${{ secrets.ISLAMIC_TV_STORE_PASSWORD }}
          ISLAMIC_TV_KEY_ALIAS: islamic-tv
        run: |
          sh scripts/test-policy.sh
          sh scripts/test-adhan.sh
          sh scripts/test-atmosphere.sh
          sh scripts/test-location.sh
          sh scripts/test-content.sh
          ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease
          cd launcher
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Verify and package
        run: |
          python3 scripts/check-public-release.py
          mkdir release
          cp app/build/outputs/apk/release/app-release.apk release/Islamic-TV.apk
          cp launcher/app/build/outputs/apk/release/app-release.apk release/TV-Home.apk
          cd release
          sha256sum *.apk > SHA256SUMS.txt
      - name: Publish installable APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "Islamic TV $GITHUB_REF_NAME" --notes-file docs/RELEASE-NOTES.md
      - name: Remove runner key
        if: always()
        run: rm -f "$RUNNER_TEMP/islamic-tv.jks"
